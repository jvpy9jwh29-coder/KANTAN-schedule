<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b57d0"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="かんたん予定">
<link rel="manifest" href="manifest.json"><title>かんたん予定</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#f5f7fb}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e8ef;padding:14px 16px;font-weight:700;font-size:19px}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #00000008}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}label{display:block;font-size:12px;color:#667085;margin:8px 0 5px}
input,select,button{font:inherit}input,select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:11px;background:#fff}
button{border:0;border-radius:12px;padding:12px 14px;background:#eef2f7;color:#172033;font-weight:600}.primary{background:#0b57d0;color:#fff;width:100%;padding:15px;font-size:16px}
.icon{font-size:22px;padding:9px 12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:#fff;border-radius:0;padding:11px 4px;font-size:12px}.tabs .active{color:#0b57d0;font-weight:800}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:#667085;padding:5px}.day{min-height:42px;padding:8px 3px;background:#fff;border:1px solid #edf0f4;border-radius:9px;text-align:center}
.day.selected{background:#0b57d0;color:#fff}.day.today{outline:2px solid #0b57d0}.day.empty{background:transparent;border:0}.event{padding:12px;border-left:4px solid #0b57d0;background:#fff;border-radius:10px;margin:8px 0}
.muted,.small{color:#667085;font-size:12px}.pill{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;background:#eef2ff;color:#174ea6}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:5px 0}
</style></head><body><header>かんたん予定</header><main id="app"></main>
<nav class="tabs"><button data-tab="entry" class="active">＋<br>予定入力</button><button data-tab="calendar">📅<br>カレンダー</button><button data-tab="settings">⚙️<br>設定</button></nav>
<script>
const KEY="kantan_schedule_safe_test";
const defaultPeople=["テスト担当A","テスト担当B","テスト担当C","テスト担当D","テスト担当E"];
const defaultPlaces=["テスト会場A","テスト会場B","テスト事務所"];
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{events:[],people:defaultPeople,places:defaultPlaces};
const appEl=document.getElementById("app"); let tab="entry",selected=new Date();selected.setHours(0,0,0,0);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){return d.toISOString().slice(0,10)}
function jp(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));tab==="entry"?entry():tab==="calendar"?calendar():settings()}
function entry(){let date=fmt(selected);appEl.innerHTML=`
<div class="card"><div class="row"><div><h2>予定を登録</h2><div class="muted">${jp(selected)}</div></div><button class="icon" id="pick">📅</button></div>
<label>日付</label><input id="date" type="date" value="${date}">
<div class="row"><div><label>開始</label><input id="start" type="time" value="10:00"></div><div><label>終了</label><input id="end" type="time" value="11:00"></div></div>
<label>予定名</label><input id="title" placeholder="例：テスト面談">
<label>担当者</label><select id="person"><option value="">指定なし</option>${db.people.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
<label>場所</label><select id="place"><option value="">指定なし</option>${db.places.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
<div class="row" style="margin-top:10px"><button id="voice">🎤 音声入力</button><select id="status"><option>確定</option><option>仮予定</option></select></div>
<div class="small" id="voiceMsg"></div></div><button class="primary" id="add">予定を保存する</button>
<div class="card"><h3>自然文入力</h3><div class="small">例：「明日10時、テスト会場Aでテスト面談」</div>
<div class="row" style="margin-top:8px"><input id="nl" placeholder="予定をそのまま入力"><button id="parse">反映</button></div></div>`;
document.getElementById("date").onchange=()=>{selected=new Date(date.value+"T00:00:00");entry()};document.getElementById("pick").onclick=()=>date.showPicker?.()||date.focus();
document.getElementById("add").onclick=()=>{let t=document.getElementById("title").value.trim();if(!t)return alert("予定名を入力してください");db.events.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),date:document.getElementById("date").value,start:document.getElementById("start").value,end:document.getElementById("end").value,title:t,person:document.getElementById("person").value,place:document.getElementById("place").value,status:document.getElementById("status").value});save();alert("予定を保存しました");document.getElementById("title").value="";render()};
document.getElementById("parse").onclick=()=>parseNL(nl.value);
document.getElementById("voice").onclick=()=>{if(!("webkitSpeechRecognition"in window)){document.getElementById("voiceMsg").textContent="音声入力はiPhoneキーボードの音声入力をご利用ください。";return}let r=new webkitSpeechRecognition();r.lang="ja-JP";r.onresult=e=>{document.getElementById("nl").value=e.results[0][0].transcript;parseNL(nl.value)};r.start();document.getElementById("voiceMsg").textContent="聞き取り中…"}
}
function parseNL(s){if(!s)return;let d=new Date(selected),m=s.match(/(\d{1,2})月(\d{1,2})日/),tm=s.match(/(\d{1,2})(?:時|:)(\d{0,2})/);if(/明日/.test(s))d.setDate(d.getDate()+1);else if(/明後日/.test(s))d.setDate(d.getDate()+2);if(m)d=new Date(d.getFullYear(),+m[1]-1,+m[2]);selected=new Date(d.getFullYear(),d.getMonth(),d.getDate());entry();if(tm){document.getElementById("start").value=String(+tm[1]).padStart(2,"0")+":"+String(tm[2]||"00").padStart(2,"0");document.getElementById("end").value=String((+tm[1]+1)%24).padStart(2,"0")+":"+String(tm[2]||"00").padStart(2,"0")}let p=db.people.find(x=>s.includes(x)),pl=db.places.find(x=>s.includes(x));if(p)document.getElementById("person").value=p;if(pl)document.getElementById("place").value=pl;title.value=s.replace(/明日|明後日|\d{1,2}月\d{1,2}日|\d{1,2}(?:時|:\d{2})/g,"").replace(/、|,|で|に/g," ").replace(p||"","").replace(pl||"","").trim()||s}
function calendar(){let y=selected.getFullYear(),m=selected.getMonth(),f=new Date(y,m,1),l=new Date(y,m+1,0),h=`<div class="card"><div class="row"><button id="prev">‹</button><h2 style="text-align:center">${y}年${m+1}月</h2><button id="next">›</button></div><div class="calendar">${["日","月","火","水","木","金","土"].map(x=>`<div class="dow">${x}</div>`).join("")}`;for(let i=0;i<f.getDay();i++)h+=`<div class="day empty"></div>`;for(let n=1;n<=l.getDate();n++){let d=new Date(y,m,n),s=fmt(d),c=s===fmt(selected)?"selected ":"";if(s===fmt(new Date()))c+="today";h+=`<button class="day ${c}" data-date="${s}">${n}</button>`}h+=`</div></div><div class="card"><h3>予定一覧</h3>`;let ev=db.events.filter(e=>e.date.slice(0,7)===`${y}-${String(m+1).padStart(2,"0")}`).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));h+=ev.length?ev.map(e=>`<div class="event"><b>${esc(e.date)} ${esc(e.start)}〜${esc(e.end)}</b> <span class="pill">${esc(e.status)}</span><div>${esc(e.title)}</div><div class="muted">${esc(e.person)} ${esc(e.place)}</div><button data-del="${e.id}">削除</button></div>`).join(""):"<div class='small'>この月の予定はありません。</div>";appEl.innerHTML=h+"</div>";document.getElementById("prev").onclick=()=>{selected=new Date(y,m-1,1);calendar()};document.getElementById("next").onclick=()=>{selected=new Date(y,m+1,1);calendar()};document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date+"T00:00:00");tab="entry";render()});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{db.events=db.events.filter(e=>e.id!==b.dataset.del);save();calendar()})}
function settings(){appEl.innerHTML=`<div class="card"><h2>設定</h2><div class="small">試作版はダミーデータ専用です。実在の個人情報は入力しないでください。</div></div>
<div class="card"><h3>👤 担当者一覧</h3>${db.people.map((x,i)=>`<div class="row" style="margin:5px 0"><input value="${esc(x)}" data-person="${i}"><button data-rmp="${i}">削除</button></div>`).join("")}<button id="addPerson">＋担当者を追加</button></div>
<div class="card"><h3>📍 場所一覧</h3>${db.places.map((x,i)=>`<div class="row" style="margin:5px 0"><input value="${esc(x)}" data-place="${i}"><button data-rml="${i}">削除</button></div>`).join("")}<button id="addPlace">＋場所を追加</button></div>
<div class="card"><h3>📷 画像から追加</h3><input id="image" type="file" accept="image/*"><div class="small">試作版では画像を保存・送信しません。OCR機能は正式版で実装します。</div></div>
<div class="card"><button id="export">テストデータを書き出す</button><button id="clear">全データ削除</button></div>`;document.querySelectorAll("[data-person]").forEach(i=>i.onchange=()=>{db.people[i.dataset.person]=i.value.trim();save()});document.querySelectorAll("[data-place]").forEach(i=>i.onchange=()=>{db.places[i.dataset.place]=i.value.trim();save()});document.querySelectorAll("[data-rmp]").forEach(b=>b.onclick=()=>{db.people.splice(+b.dataset.rmp,1);save();settings()});document.querySelectorAll("[data-rml]").forEach(b=>b.onclick=()=>{db.places.splice(+b.dataset.rml,1);save();settings()});document.getElementById("addPerson").onclick=()=>{let x=prompt("ダミー担当者名");if(x){db.people.push(x);save();settings()}};document.getElementById("addPlace").onclick=()=>{let x=prompt("ダミー場所名");if(x){db.places.push(x);save();settings()}};document.getElementById("export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="かんたん予定_テストデータ.json";a.click()};document.getElementById("clear").onclick=()=>{db={events:[],people:defaultPeople,places:defaultPlaces};save();settings()}}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
